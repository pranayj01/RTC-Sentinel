name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - run: npm install
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: pip install -r requirements-dev.txt
        working-directory: ml-service
      - run: ruff check .
        working-directory: ml-service
      - run: pytest
        working-directory: ml-service

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: rtc-sentinel-ci-postgres-password
      JWT_ACCESS_SECRET: rtc-sentinel-ci-access-secret-32-characters
      JWT_REFRESH_SECRET: rtc-sentinel-ci-refresh-secret-32-characters
      TURN_CREDENTIAL: rtc-sentinel-ci-turn-credential
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test services and dependencies
        run: |
          curl --fail http://localhost:5173
          test "$(curl --silent http://localhost:3000/health)" = '{"status":"ok"}'
          test "$(curl --silent http://localhost:8000/health)" = '{"status":"ok"}'
          curl --fail http://localhost:8000/model/info | grep '"type":"machine-learning"'
          curl --fail http://localhost:8000/audio/model/info | grep '"type":"machine-learning"'
          node server/scripts/analytics-smoke.mjs
          node server/scripts/security-smoke.mjs
          node server/scripts/reliability-smoke.mjs
          docker compose exec -T postgres pg_isready -U rtc_sentinel -d rtc_sentinel
          test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = 'PONG'
      - name: Browser-to-browser WebRTC E2E test
        run: npm run test:e2e
      - if: always()
        run: docker compose down --volumes
